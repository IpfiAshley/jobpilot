[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-tech-jobpilot"
version = "0.2.0"
description = "South African and remote tech job ingestion and CV matching"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.4,<3.0",
  "httpx>=0.27,<1.0",
  "feedparser>=6.0,<7.0",
  "beautifulsoup4>=4.12,<5.0",
  "scikit-learn>=1.5,<2.0",
  "pymupdf>=1.24,<2.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "reportlab>=4.2,<5.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1.0", "mypy>=1.11,<2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobpilot = ["web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

