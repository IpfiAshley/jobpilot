name: Daily job ingestion
on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Ingest jobs
        run: python scripts/run_ingestion.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RSS_FEED_URLS: ${{ vars.RSS_FEED_URLS }}
          USER_AGENT: JobPilot/0.1 (+contact: ${{ vars.CONTACT_EMAIL }})
