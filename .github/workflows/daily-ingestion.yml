name: Daily job ingestion
on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Ingest jobs
        run: >-
          curl --fail --silent --show-error --request POST
          --retry 5 --retry-all-errors --retry-delay 15
          --header "Authorization: Bearer ${INGESTION_TOKEN}"
          "https://jobpilot-preview.onrender.com/api/v1/admin/ingest"
        env:
          INGESTION_TOKEN: ${{ secrets.JOBPILOT_INGESTION_TOKEN }}

